<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion Recipe Book</title>
<meta name="description" content="Every craftable Albion Online item with its materials, artifacts and live Europe prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane workbench. Item index on the left, the open recipe card on the right; one column on phones. */
:root {
  --bg: #eef0ec; --panel: #f9faf7; --ink: #1d2320; --muted: #5d6762; --line: #d3d8d2;
  --accent: #8a5a2b; --accent-soft: #f1e4d4; --silver: #5f6f74;
  --e0: #6b7570; --e1: #3f8a3a; --e2: #2f6db3; --e3: #7d4bb0; --e4: #b8860b;
  --warn: #a23b2c;
  --display: "Alegreya SC", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a1f1c; --ink: #e3e7e2; --muted: #9aa49e; --line: #2d3530;
  --accent: #d79c62; --accent-soft: #3a2b1d; --silver: #a7b6bb;
  --e0: #9aa49e; --e1: #6cc165; --e2: #66a3ea; --e3: #b48ae6; --e4: #e3b341; --warn: #e07a68; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a1f1c; --ink: #e3e7e2; --muted: #9aa49e; --line: #2d3530;
  --accent: #d79c62; --accent-soft: #3a2b1d; --silver: #a7b6bb;
  --e0: #9aa49e; --e1: #6cc165; --e2: #66a3ea; --e3: #b48ae6; --e4: #e3b341; --warn: #e07a68; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; max-width: 1180px; margin: 0 auto 14px }
h1 { font: 700 1.6rem/1.1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance }
h1 span { color: var(--accent) }
.where { font-size: .9rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
select, input, button { font: inherit; color: var(--ink) }
select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0 }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); padding: 7px 12px }
button:focus-visible, select:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; max-width: 1180px; margin: 0 auto; align-items: start }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr) } }
.index { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.filters input { grid-column: 1 / -1 }
.filters select, .filters input { width: 100%; min-width: 0 }
.count { font-size: .85rem; color: var(--muted) }
.list { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: 70vh; overflow-y: auto }
@media (max-width: 760px) { .list { max-height: 42vh } }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; background: none }
.row:last-child { border-bottom: 0 }
.row:hover { background: var(--accent-soft) }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent) }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .sub { font-size: .8rem; color: var(--muted); white-space: nowrap }
.tier { font: 500 .78rem var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); flex: none }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.card h2 { font: 700 1.45rem/1.15 var(--display); margin: 0; text-wrap: balance }
.meta { color: var(--muted); font-size: .92rem; margin-top: 2px }
.ench { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 4px }
.ench button { font: 500 .9rem var(--mono); padding: 5px 12px; border-color: var(--line) }
.ench button[aria-pressed="true"] { color: var(--bg); background: var(--c); border-color: var(--c) }
.ench button { --c: var(--e0) }
.ench .l1 { --c: var(--e1) } .ench .l2 { --c: var(--e2) } .ench .l3 { --c: var(--e3) } .ench .l4 { --c: var(--e4) }
.recipe { margin-top: 16px }
.recipe h3 { font: 500 .78rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .92rem; margin-bottom: 8px }
.facts b { font-family: var(--mono); font-weight: 500 }
.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { font: 500 .78rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap }
td .id { display: block; font: .75rem var(--mono); color: var(--muted) }
.art { display: inline-block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-align: left }
.age { display: block; font: .72rem var(--mono); color: var(--muted) }
.old { color: var(--warn) }
.total td { font-weight: 700; border-bottom: 0 }
.prices { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.prices .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500 }
.note { font-size: .88rem; color: var(--muted); flex-basis: 100% }
.note.err { color: var(--warn) }
.empty { color: var(--muted); padding: 24px 12px; text-align: center }
footer { max-width: 1180px; margin: 20px auto 0; font-size: .8rem; color: var(--muted) }
.unlock { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px }
.unlock summary { font: 500 .78rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); cursor: pointer }
.unlock ol { margin: 10px 0 6px; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem }
.unlock li::marker { color: var(--accent); font-family: var(--mono) }
.unlock .goal-step { color: var(--ink) }
.unlock .goal-step b { color: var(--accent) }
.unlock a { color: var(--accent) }
.unlock .note { margin: 4px 0 0 }
.ico { flex: none; object-fit: contain }
.row .ico { margin: -4px 0 }
.title { display: flex; gap: 14px; align-items: center }
.mat { display: flex; gap: 10px; align-items: center }
nav.tabs { display: flex; gap: 4px; max-width: 1180px; margin: 0 auto 18px; border-bottom: 1px solid var(--line); overflow-x: auto }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 9px 14px; color: var(--muted); font: 500 1rem var(--body); white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs .pct { font: .78rem var(--mono); color: var(--accent); margin-left: 6px }
.path { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
.path-head { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between }
.path-head h2 { font: 700 1.5rem/1.15 var(--display); margin: 0 }
.path-head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 180px; flex: 1; max-width: 320px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
.barlabel { font: .85rem var(--mono); color: var(--muted) }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px }
.stage > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 8px; max-width: none }
.stage h3 { font: 700 1.15rem var(--display); margin: 0 }
.stage .why { color: var(--muted); font-size: .92rem; margin: 0 0 10px }
.stage .done-count { font: .8rem var(--mono); color: var(--muted); white-space: nowrap }
.stage.complete { border-color: var(--accent) }
.stage.complete .done-count { color: var(--accent) }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line) }
.step input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent) }
.step label { font-weight: 500; cursor: pointer }
.step.checked label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line) }
.step .detail { grid-column: 2; font-size: .93rem; color: var(--muted) }
.step .detail ul { margin: 4px 0 0; padding-left: 18px }
.step .detail b { color: var(--ink); font-weight: 500 }
.step .field { grid-column: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: .9rem }
.step .field input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; width: 16rem; max-width: 100% }
.mono { font-family: var(--mono) }
.goal { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px }
.goal label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted) }
.goal input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: 1rem var(--mono); width: 100% }
.goal .out { font-size: .95rem; grid-column: 1 / -1 }
.goal .out b { font-family: var(--mono); font-weight: 500 }
.next { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: 10px; padding: 14px 18px }
.next .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500 }
.reset { align-self: flex-start; font-size: .85rem; color: var(--muted) }
</style>
</head>
<body>

<header>
  <h1>Albion <span>Recipe Book</span></h1>
  <div class="where">
    <label for="city">Prices from</label>
    <select id="city">
      <option>Fort Sterling</option><option>Martlock</option><option>Thetford</option><option>Lymhurst</option>
      <option>Bridgewatch</option><option>Caerleon</option><option>Brecilien</option><option>Black Market</option>
    </select>
    <span>· Europe server</span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="tab-recipes" data-view="recipes" aria-selected="true">Recipes</button>
  <button role="tab" id="tab-crafting" data-view="crafting" aria-selected="false">Crafting path<span class="pct" id="pct-crafting"></span></button>
  <button role="tab" id="tab-island" data-view="island" aria-selected="false">Island path<span class="pct" id="pct-island"></span></button>
</nav>

<section id="view-crafting" class="path" hidden></section>
<section id="view-island" class="path" hidden></section>

<div id="view-recipes">
<div class="wrap">
  <section class="index" aria-label="Find an item">
    <div class="filters">
      <input id="q" type="search" placeholder="Search items, e.g. hellion hood" autocomplete="off">
      <select id="cat" aria-label="Category"><option value="">All categories</option></select>
      <select id="tier" aria-label="Tier"><option value="">All tiers</option></select>
    </div>
    <div class="count" id="count">Loading recipes…</div>
    <div class="list" id="list" role="list"></div>
  </section>
  <main class="card" id="card"><p class="empty">Loading recipes…</p></main>
</div>
<footer>Recipes from the game files (ao-data/ao-bin-dumps). Prices from the Albion Online Data Project, uploaded by players running the Albion Data Client. The quantities are per craft, before your return rate.</footer>
</div>

<script>
const AODP = "https://europe.albion-online-data.com/api/v2/stats/prices/";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let DB = null, current = null, level = "0", view = "recipes";
const $ = id => document.getElementById(id);
const cityEl = $("city");
cityEl.value = store.get("city") || "Fort Sterling";

const pretty = s => (s || "other").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const nameOf = id => DB.names[id.split("@")[0]] || pretty(id.split("@")[0].replace(/^T\d_/, ""));
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const priceId = (id, lvl) => lvl === "0" ? id : id + "@" + lvl;
const icon = (id, px) => `<img class="ico" src="https://render.albiononline.com/v1/item/${encodeURIComponent(id)}.png?size=${px * 2}&quality=1" width="${px}" height="${px}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
const QUALITY = { 2: "Good", 3: "Outstanding", 4: "Excellent", 5: "Masterpiece" };

function ageText(iso) {
  if (!iso || iso.startsWith("0001")) return null;
  const ms = Date.now() - new Date(iso + (iso.endsWith("Z") ? "" : "Z")).getTime();
  const h = ms / 3.6e6;
  return { text: h < 1 ? Math.max(1, Math.round(ms / 6e4)) + " min ago" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago", old: h > 24 };
}

function priceKey(id) { return cityEl.value + "|" + id }
function getPrice(id) { return store.get("p:" + priceKey(id)) }

async function boot() {
  const res = await fetch("recipes.json");
  DB = await res.json();
  const cats = new Map(), tiers = new Set();
  DB.list = Object.entries(DB.items).map(([id, it]) => {
    const label = it.c + "/" + it.s;
    cats.set(label, pretty(it.c) + " · " + pretty(it.s));
    if (it.t) tiers.add(it.t);
    return { id, it, name: nameOf(id), hay: (nameOf(id) + " " + id + " " + it.s).toLowerCase() };
  }).sort((a, b) => a.name.localeCompare(b.name) || a.it.t - b.it.t);
  [...cats].sort((a, b) => a[1].localeCompare(b[1])).forEach(([v, t]) => $("cat").add(new Option(t, v)));
  [...tiers].sort((a, b) => a - b).forEach(t => $("tier").add(new Option("Tier " + t, t)));
  const start = location.hash.slice(1);
  renderList();
  open(DB.items[start] ? start : (store.get("last") && DB.items[store.get("last")] ? store.get("last") : "T4_HEAD_LEATHER_HELL"));
}

function renderList() {
  const q = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const cat = $("cat").value, tier = +$("tier").value;
  const hits = DB.list.filter(e => (!cat || e.it.c + "/" + e.it.s === cat) && (!tier || e.it.t === tier) && q.every(w => e.hay.includes(w)));
  const shown = hits.slice(0, 200);
  $("count").textContent = hits.length.toLocaleString("en-US") + " items" + (hits.length > 200 ? ", showing the first 200" : "");
  const list = $("list");
  list.replaceChildren(...shown.map(e => {
    const b = document.createElement("button");
    b.className = "row"; b.dataset.id = e.id; b.setAttribute("role", "listitem");
    if (current === e.id) b.setAttribute("aria-current", "true");
    b.innerHTML = `${icon(e.id, 32)}<span class="tier">T${e.it.t || "–"}</span><span class="nm"></span><span class="sub"></span>`;
    b.querySelector(".nm").textContent = e.name;
    b.querySelector(".sub").textContent = pretty(e.it.s);
    b.onclick = () => open(e.id, true);
    return b;
  }));
  if (!shown.length) list.innerHTML = '<p class="empty">No craftable item matches. Try fewer words.</p>';
}

function open(id, scroll) {
  current = id; level = DB.items[id].r[level] ? level : "0";
  store.set("last", id);
  if (view === "recipes") try { history.replaceState(null, "", "#" + id) } catch {}
  document.querySelectorAll(".row").forEach(r => r.dataset.id === id ? r.setAttribute("aria-current", "true") : r.removeAttribute("aria-current"));
  renderCard();
  if (scroll && matchMedia("(max-width: 760px)").matches) $("card").scrollIntoView({ behavior: "smooth", block: "start" });
}

function cell(id, count, isArt) {
  const p = getPrice(id), a = p && ageText(p.d);
  return { id, count, isArt, price: p ? p.s : null, age: a, q: p && p.q > 1 ? QUALITY[p.q] : null };
}

function renderCard() {
  const it = DB.items[current], recs = it.r[level];
  const card = $("card");
  const lv = Object.keys(it.r);
  const own = cell(priceId(current, level));
  let html = `<div class="title">${icon(priceId(current, level), 72)}<div><h2></h2><div class="meta">Tier ${it.t || "–"} · ${pretty(it.c)} · ${pretty(it.s)}</div></div></div>`;
  if (lv.length > 1) html += `<div class="ench" role="group" aria-label="Enchantment">${lv.map(l => `<button class="l${l}" data-l="${l}" aria-pressed="${l === level}">${it.t ? it.t + "." + l : "." + l}</button>`).join("")}</div>`;
  html += unlockHtml(current, it);
  recs.forEach((r, i) => {
    const rows = r.m.map(([mid, cnt, art]) => cell(mid, cnt, art));
    const total = rows.every(x => x.price) ? rows.reduce((s, x) => s + x.price * x.count, 0) : null;
    html += `<div class="recipe"><h3>${recs.length > 1 ? (i === 0 ? "Recipe" : "Alternative recipe " + i) : "Recipe"}</h3>
      <div class="facts"><span>Makes <b>${r.n}</b> per craft</span>${r.f ? `<span>Focus <b>${fmt(r.f)}</b></span>` : ""}${r.s ? `<span>Silver <b>${fmt(r.s)}</b></span>` : ""}${r.u ? `<span>Or upgrade from .${+level - 1}: <b>${r.u[1]}</b> ${esc(nameOf(r.u[0]))}</span>` : ""}</div>
      <div class="tablewrap"><table><thead><tr><th>Material</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td><div class="mat">${icon(x.id, 40)}<div>${DB.items[x.id.split("@")[0]] && !x.id.includes("_LEVEL") ? `<button class="link" data-open="${x.id.split("@")[0]}">${esc(nameOf(x.id))}</button>` : esc(nameOf(x.id))}${x.isArt ? '<span class="art" title="Artifacts are used up and never returned">not returned</span>' : ""}<span class="id">${x.id}</span></div></div></td>
        <td class="num">${x.count}</td><td class="num">${fmt(x.price)}${x.age ? `<span class="age ${x.age.old ? "old" : ""}">${x.age.text}</span>` : ""}</td><td class="num">${x.price ? fmt(x.price * x.count) : "—"}</td></tr>`).join("")}
      <tr class="total"><td colspan="3">Materials at full price${r.n > 1 ? ` (÷ ${r.n} = ${total ? fmt(total / r.n) : "—"} each)` : ""}</td><td class="num">${fmt(total)}</td></tr>
      </tbody></table></div></div>`;
  });
  html += `<div class="prices"><button class="primary" id="load">Refresh prices</button>
    <span>Sells for <b style="font-family:var(--mono)">${fmt(own.price)}</b>${own.q ? ` (${own.q})` : ""}${own.age ? ` <span class="age ${own.age.old ? "old" : ""}" style="display:inline">${own.age.text}</span>` : ""}</span>
    <p class="note" id="note">Prices are the cheapest sell order in ${esc(cityEl.value)} at any quality. Live from the Albion Online Data Project, refreshed when you open an item (at most every 10 minutes).</p></div>`;
  card.innerHTML = html;
  card.querySelector("h2").textContent = nameOf(current) + (level !== "0" ? " ." + level : "");
  card.querySelectorAll(".ench button").forEach(b => b.onclick = () => { level = b.dataset.l; renderCard() });
  card.querySelectorAll("[data-open]").forEach(b => b.onclick = () => open(b.dataset.open, true));
  $("load").onclick = () => loadPrices(true);
  loadPrices(false);
}

// Destiny Board crafting nodes, from the Albion wiki crafter pages (checked 24 Oct 2026).
// Every crafter node unlocks tiers 4–8 at levels 1, 10, 30, 60 and 100; only the fame for level 1 differs.
const HUNTER = "Hunter's Lodge", WARRIOR = "Warrior's Forge", MAGE = "Mage's Tower", TOOL = "Toolmaker";
const NODES = {
  bow: [HUNTER, "Bow Crafter", 14424], dagger: [HUNTER, "Dagger Crafter", 14424], spear: [HUNTER, "Spear Crafter", 14424],
  quarterstaff: [HUNTER, "Quarterstaff Crafter", 14424], naturestaff: [HUNTER, "Nature Staff Crafter", 14424], torchtype: [HUNTER, "Torch Crafter", 3606],
  leather_helmet: [HUNTER, "Leather Hood Crafter", 3606], leather_armor: [HUNTER, "Leather Jacket Crafter", 3606], leather_shoes: [HUNTER, "Leather Shoes Crafter", 3606],
  sword: [WARRIOR, "Sword Crafter", 14424], axe: [WARRIOR, "Battleaxe Crafter", 14424], mace: [WARRIOR, "Mace Crafter", 14424],

const TIER_LEVEL = { 4: 1, 5: 10, 6: 30, 7: 60, 8: 100 };
const wiki = page => `<a href="https://wiki.albiononline.com/wiki/${encodeURIComponent(page.replace(/ /g, "_"))}" target="_blank" rel="noopener">${esc(page)}</a>`;

function nodeFor(id, it) {
  if (/BAIT|TRACKING/.test(id)) return null;
  if (it.c === "other" && /SIEGEHAMMER/.test(id)) return [TOOL, "Siege Hammer Crafter", 14424];
  return NODES[it.c + "/" + it.s] || NODES[it.s] || null;
}

function unlockHtml(id, it) {
  const node = nodeFor(id, it), t = it.t;
  if (!node || t < 2) return `<details class="unlock"><summary>Unlock path</summary><p class="note">The wiki doesn't list a Destiny Board path for this kind of item yet. Hover the item's node on your Destiny Board (B) to see it.</p></details>`;
  const [station, name, fame1] = node;
  const journeyman = station === TOOL ? "Journeyman Toolmaker" : `Journeyman ${station} Crafter`;
  const steps = [`<li><b>Trainee Craftsman</b>: the starting crafting node. Unlocks tier 2.</li>`];
  if (t >= 3) steps.push(station
    ? `<li><b>${esc(journeyman)}</b>: 1 level, <b>480 fame</b> from crafting any tier 2 item at the ${esc(station)}. Unlocks tier 3.</li>`
    : `<li><b>The journeyman node for this crafting station</b> (not on the wiki yet). Unlocks tier 3.</li>`);
  for (let tier = 4; tier <= t; tier++) {
    const lvl = TIER_LEVEL[tier], last = tier === t;
    steps.push(`<li${last ? ' class="goal-step"' : ""}><b>${wiki(name)} level ${lvl}</b>${tier === 4 ? (fame1 ? `: <b>${fmt(fame1)} fame</b> from crafting tier 3 items of this type` : "") : ""}. Unlocks tier ${tier}${last ? ", <b>this item</b>" : ""}.</li>`);
  }
  return `<details class="unlock" open><summary>Unlock path to tier ${t}</summary><ol>${steps.join("")}</ol>
    <p class="note">${station ? `Craft at the <b>${esc(station)}</b>. ` : "Not on the wiki yet; the station and fame are unconfirmed. "}Enchanted versions need the same level. Fame for levels after the first isn't published; hover the node on your Destiny Board (B) to see it. Source: Albion wiki.</p></details>`;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }

function note(text, err) { const n = $("note"); if (n) { n.textContent = text; n.classList.toggle("err", !!err) } }

function parseJsonArray(payload) {
  const text = typeof payload === "string" ? payload : JSON.stringify(payload);
  const a = text.indexOf("["), b = text.lastIndexOf("]");
  if (a < 0 || b < a) throw new Error("no price list in the page");
  return JSON.parse(text.slice(a, b + 1));
}

let loading = 0;
async function loadPrices(force) {
  const recs = DB.items[current].r[level];
  const ids = [...new Set([priceId(current, level), ...recs.flatMap(r => r.m.map(m => m[0]))])];
  const city = cityEl.value, key = city + "|" + current + "|" + level;
  const fetched = store.get("f:" + key);
  if (!force && fetched && Date.now() - fetched < 10 * 60 * 1000) return;
  const mine = ++loading;
  const btn = $("load"); if (btn) btn.disabled = true;
  note("Loading " + city + " prices…");
  const url = AODP + ids.map(encodeURIComponent).join(",") + ".json?locations=" + encodeURIComponent(city);
  try {
    const res = await fetch(url);
    if (res.status === 429) throw new Error("The price server is busy (too many requests). Wait a minute and refresh.");
    if (!res.ok) throw new Error("The price server answered " + res.status + ".");
    const rows = await res.json();
    const best = {};
    for (const row of rows) {
      if (row.sell_price_min > 0 && (!best[row.item_id] || row.sell_price_min < best[row.item_id].s))
        best[row.item_id] = { s: row.sell_price_min, d: row.sell_price_min_date, q: row.quality };
    }
    for (const id of ids) store.set("p:" + city + "|" + id, best[id] || null);
    store.set("f:" + key, Date.now());
    if (mine !== loading) return;
    renderCard();
    const got = Object.keys(best).length;
    note(got ? `${got} of ${ids.length} prices found. A dash means nobody in ${city} is selling it right now.` : `No sell orders found in ${city} for these items.`, !got);
  } catch (e) {
    if (mine !== loading) return;
    note(e instanceof TypeError ? "Couldn't reach the price server. Check your connection and refresh." : e.message, true);
    const b = $("load"); if (b) b.disabled = false;
  }
}

function progress() { return store.get("progress") || { checked: {}, fields: {} } }
function saveProgress(p) { store.set("progress", p); updatePct() }
function pathPct(key) {
  const p = progress(), steps = PATHS[key].stages.flatMap(s => s.steps);
  return Math.round(100 * steps.filter(s => p.checked[s.id]).length / steps.length);
}
function updatePct() {
  for (const key of Object.keys(PATHS)) {
    const pct = pathPct(key);
    $("pct-" + key).textContent = pct ? pct + "%" : "";
    const bar = document.querySelector(`#view-${key} .bar i`); if (bar) bar.style.width = pct + "%";
    const lbl = document.querySelector(`#view-${key} .barlabel`); if (lbl) lbl.textContent = pct + "% done";
  }
}

function renderPath(key) {
  const P = PATHS[key], p = progress(), el = $("view-" + key);
  let html = `<div class="path-head"><div><h2>${P.title}</h2><p>${P.intro}</p></div><div style="display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end"><div class="bar"><i></i></div><span class="barlabel"></span></div></div>`;
  if (P.goal) {
    const f = p.fields;
    html += `<div class="stage"><header><h3>Silver goal</h3></header><div class="goal">
      <label for="g-silver">Silver saved<input id="g-silver" inputmode="numeric" data-field="g-silver" value="${esc(f["g-silver"] || "")}" placeholder="e.g. 613000"></label>
      <label for="g-daily">Crafting profit per day<input id="g-daily" inputmode="numeric" data-field="g-daily" value="${esc(f["g-daily"] || "")}" placeholder="e.g. 250000"></label>
      <p class="out" id="g-out"></p></div></div>`;
  }
  P.stages.forEach(s => {
    const done = s.steps.filter(x => p.checked[x.id]).length;
    html += `<section class="stage${done === s.steps.length ? " complete" : ""}"><header><h3>${s.title}</h3><span class="done-count">${done} / ${s.steps.length}</span></header><p class="why">${s.why}</p>`;
    s.steps.forEach(x => {
      html += `<div class="step${p.checked[x.id] ? " checked" : ""}"><input type="checkbox" id="${x.id}" data-step="${x.id}"${p.checked[x.id] ? " checked" : ""}><label for="${x.id}">${x.title}</label>
        <div class="detail">${x.detail}${x.link ? ` <button class="link" data-item="${x.link.item}">${x.link.text}</button>` : ""}</div>
        ${x.field ? `<div class="field"><label for="f-${x.id}">${x.field.label}</label><input id="f-${x.id}" data-field="f-${x.id}" value="${esc(p.fields["f-" + x.id] || "")}" placeholder="${x.field.placeholder}"></div>` : ""}</div>`;
    });
    html += `</section>`;
  });
  if (P.next) html += `<div class="next"><span>${P.next.text}</span><button class="primary" data-go="${P.next.to}">${P.next.label}</button></div>`;
  html += `<button class="reset" data-reset="${key}">Clear this path's progress</button>`;
  el.innerHTML = html;
  el.querySelectorAll("[data-step]").forEach(cb => cb.onchange = () => {
    const pr = progress(); pr.checked[cb.dataset.step] = cb.checked || undefined; saveProgress(pr); renderPath(key);
  });
  el.querySelectorAll("[data-field]").forEach(inp => inp.oninput = () => {
    const pr = progress(); pr.fields[inp.dataset.field] = inp.value; saveProgress(pr); if (P.goal) goalOut();
  });
  el.querySelectorAll("[data-item]").forEach(b => b.onclick = () => { show("recipes"); open(b.dataset.item) });
  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { show(b.dataset.go); scrollTo(0, 0) });
  const reset = el.querySelector("[data-reset]");
  reset.onclick = () => {
    if (reset.dataset.armed) {
      const pr = progress(); P.stages.flatMap(s => s.steps).forEach(x => { delete pr.checked[x.id]; delete pr.fields["f-" + x.id] });
      saveProgress(pr); renderPath(key);
    } else { reset.dataset.armed = "1"; reset.textContent = "Click again to clear all checkmarks and notes in this path" }
  };
  if (P.goal) goalOut();
  updatePct();
}

function goalOut() {
  const num = v => +String(v || "").replace(/[^\d]/g, "") || 0;
  const f = progress().fields, have = num(f["g-silver"]), daily = num(f["g-daily"]), out = $("g-out");
  if (!out) return;
  if (!have && !daily) { out.textContent = `A fully upgraded island costs about ${fmt(ISLAND_COST)} silver. Enter your savings to see how far you are.`; return }
  const left = ISLAND_COST - have;
  if (left <= 0) { out.innerHTML = `You have enough for the island, with <b>${fmt(-left)}</b> to spare for seeds and farms.`; return }
  out.innerHTML = `<b>${Math.floor(100 * have / ISLAND_COST)}%</b> of the island saved. <b>${fmt(left)}</b> to go` + (daily ? `, about <b>${Math.ceil(left / daily)} days</b> at ${fmt(daily)} a day.` : ".");
}

function show(v) {
  view = v;
  for (const k of ["recipes", "crafting", "island"]) {
    $("view-" + k).hidden = k !== v;
    $("tab-" + k).setAttribute("aria-selected", k === v);
  }
  if (v !== "recipes") renderPath(v);
  const hash = v === "recipes" ? current : v;
  if (hash) try { history.replaceState(null, "", "#" + hash) } catch {}
  store.set("view", v);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.dataset.view));

  const h = location.hash.slice(1);
